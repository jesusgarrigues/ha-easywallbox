send_command:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: easywallbox
    command:
      required: true
      example: "$EEP,READ,IDX,156"
      selector:
        text:
    timeout:
      required: false
      default: 10
      selector:
        number:
          min: 1
          max: 60
          unit_of_measurement: s
