name: Release

# Three ways to release (all attach easywallbox.zip, with the manifest version
# set from the tag):
#  - Actions > Release > Run workflow, entering the version (e.g. 0.1.0): creates
#    the v0.1.0 tag on the current main and the release.
#  - Pushing a tag like v0.1.0.
#  - Publishing a release manually from the GitHub UI.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the leading v (e.g. 0.1.0)"
        required: true
  push:
    tags:
      - "v*"
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set version from tag
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then VERSION="${INPUT_VERSION#v}"; else VERSION="${GITHUB_REF_NAME#v}"; fi
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
            echo "Invalid version: $VERSION"; exit 1
          fi
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          jq --arg v "$VERSION" '.version = $v' custom_components/easywallbox/manifest.json > m.json
          mv m.json custom_components/easywallbox/manifest.json
      - name: Zip integration
        run: cd custom_components/easywallbox && zip -r ../../easywallbox.zip .
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: easywallbox.zip
